<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311b92"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="grid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.5"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#38bdf8" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background Rounded Square -->
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>

  <!-- Subtle Grid Pattern in Background -->
  <path d="M 128,0 V 512 M 256,0 V 512 M 384,0 V 512 M 0,128 H 512 M 0,256 H 512 M 0,384 H 512" 
        stroke="#ffffff" stroke-opacity="0.04" stroke-width="2"/>

  <!-- Globe / Atlas Symbol -->
  <g filter="url(#shadow)">
    <!-- Globe Outer Boundary -->
    <circle cx="256" cy="256" r="148" fill="none" stroke="url(#glow)" stroke-width="22"/>
    
    <!-- Longitude Curves -->
    <ellipse cx="256" cy="256" rx="76" ry="148" fill="none" stroke="url(#grid)" stroke-width="14"/>
    <line x1="256" y1="108" x2="256" y2="404" stroke="url(#glow)" stroke-width="16" stroke-linecap="round"/>
    
    <!-- Latitude Curves -->
    <line x1="108" y1="256" x2="404" y2="256" stroke="url(#glow)" stroke-width="16" stroke-linecap="round"/>
    <ellipse cx="256" cy="256" rx="148" ry="70" fill="none" stroke="url(#grid)" stroke-width="12"/>

    <!-- Core Atlas Pin / Focus Node -->
    <circle cx="256" cy="256" r="32" fill="#ffffff"/>
    <circle cx="256" cy="256" r="18" fill="#0f172a"/>
    <circle cx="256" cy="256" r="8" fill="#38bdf8"/>
  </g>
</svg>
