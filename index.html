<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
  
  <!-- Primary Meta & Title -->
  <title>Atlas Workspace</title>
  <meta name="title" content="Atlas Workspace" />
  <meta name="description" content="Atlas Workspace - Workspace para organizar links, cadernos de anotações, diagramas Excalidraw, Draw.io, scripts e credenciais." />
  <meta name="author" content="Reginaldo de Souza" />
  
  <!-- PWA Manifest & Colors -->
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#4f46e5" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)" />
  
  <!-- Mobile & iOS Web App Meta Tags -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Atlas" />
  <meta name="application-name" content="Atlas Workspace" />
  <meta name="format-detection" content="telephone=no" />
  <meta name="msapplication-TileColor" content="#4f46e5" />
  <meta name="msapplication-tap-highlight" content="no" />

  <!-- Icons -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=3" />
  <link rel="alternate icon" href="/favicon.svg?v=3" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="/web-app-manifest-192x192.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="/web-app-manifest-512x512.png" />

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Atlas Workspace" />
  <meta property="og:description" content="Workspace pessoal para organizar links, anotações, diagramas e credenciais com facilidade e segurança." />
  <meta property="og:image" content="/web-app-manifest-512x512.png" />
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
